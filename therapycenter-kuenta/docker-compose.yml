version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: therapycenter-kuenta_web_1
      APP_PORT: 3700

  web:
    image: ghcr.io/therapycenter/kuenta:1.8.1@sha256:5f0e75db7ddd81b2335e0a8e286098cb651c06733fd62bdd685f9e611fb2921c
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: Europe/Berlin
    volumes:
      - ${APP_DATA_DIR}/data:/data
