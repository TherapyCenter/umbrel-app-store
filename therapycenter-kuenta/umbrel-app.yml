id: therapycenter-kuenta
name: KuentaPOS
tagline: Invoicing, cash register and e-invoices for auto repair shops
icon: https://raw.githubusercontent.com/TherapyCenter/KuentaPOS/main/public/img/icon.svg
category: finance
version: "1.8.4"
port: 3700
description: >-
  KuentaPOS is a complete business application for auto repair shops and small businesses:
  customers and vehicles, quotes, work orders, delivery notes, invoices and credit notes,
  payments and dunning, a cash register, parts and stock, tyre storage, appointments and
  time tracking.


  It speaks the tax rules of eleven countries, each company can use its own: Germany
  (TSE, DATEV, XRechnung/ZUGFeRD), Austria (RKSV, UVA, ebInterface), Switzerland (QR-bill,
  CHF), France (Factur-X, Chorus Pro, FEC), Italy (FatturaPA), the Netherlands, Belgium and
  Luxembourg (Peppol, Intervat, eCDF), Spain (VERI*FACTU, Facturae), the United Kingdom
  (Making Tax Digital) and the United States (sales tax). Documents can be printed in German,
  English, Spanish, Italian, Dutch and French.


  Customers can pay invoices with Bitcoin, Lightning or USDT through your own BTCPay Server.


  All data stays on your Umbrel. Open KuentaPOS in the browser of any device in your network,
  for example on a tablet in the workshop. Back up your data in KuentaPOS under "KuentaPOS → Back up data".
