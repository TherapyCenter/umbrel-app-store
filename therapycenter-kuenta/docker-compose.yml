version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: therapycenter-kuenta_web_1
      APP_PORT: 3700

  web:
    image: ghcr.io/therapycenter/kuentapos:1.8.4@sha256:c1398f222174fdbf75bdbcbcfed791f94e20bc6a8c4afd818c7285b0b979cc51
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: Europe/Berlin
    volumes:
      - ${APP_DATA_DIR}/data:/data
