version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: therapycenter-kuenta_web_1
      APP_PORT: 3700

  web:
    image: ghcr.io/therapycenter/kuentapos:1.9.0@sha256:ed197b8190bd8f0df644270df2ef38edda589a9f4c4429fea04d270d108fa29b
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: Europe/Berlin
    volumes:
      - ${APP_DATA_DIR}/data:/data
