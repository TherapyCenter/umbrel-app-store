version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: therapycenter-kuenta_web_1
      APP_PORT: 3700

  web:
    image: ghcr.io/therapycenter/kuentapos:1.8.3@sha256:fe73b2d6a0ced441bedd4084d9868902a57a40c46ac28bed4ce6284c8f3ddba4
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: Europe/Berlin
    volumes:
      - ${APP_DATA_DIR}/data:/data
